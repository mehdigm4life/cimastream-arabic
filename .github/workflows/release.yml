name: Build and Publish Extensions

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0"

      - name: Build providers
        run: |
          ./gradlew --no-daemon :arabic:make makePluginsJson

      - name: Force push artifacts to plugins branch
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/plugins; then
            git checkout -B plugins
          else
            git checkout --orphan plugins
          fi
          git rm -rf . >/dev/null 2>&1 || true
          cp -f arabic/build/arabic.cima4 ./arabic.cima4
          cp -f build/plugins.json ./plugins.json
          cp -f icon.png ./icon.png
          git add -f arabic.cima4 plugins.json icon.png
          git -c user.name="MehdiGM" -c user.email="mehdigm4life@users.noreply.github.com" commit -m "Update plugins [skip ci]" || true
          git push --force origin plugins